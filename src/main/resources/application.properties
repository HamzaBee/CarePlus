# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/careplusdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=careplususer
spring.datasource.password=carepluspassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


# Allow serving static resources
spring.web.resources.static-locations=classpath:/static/

